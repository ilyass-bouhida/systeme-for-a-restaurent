services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gigino_pos}
      MYSQL_USER: ${MYSQL_USER:-gigino}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gigino-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gigino-local-root-password}
    ports:
      - "3307:3306"
    volumes:
      - gigino_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_ROOT_PASSWORD:-gigino-local-root-password}",
        ]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  gigino_mysql_data:
